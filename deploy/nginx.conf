# 语图生产 Nginx 配置（构建进镜像 /etc/nginx/conf.d/default.conf）
server {
    listen 80;
    server_name _;

    # 头像等上传体积限制（后端 multer 同域上传）
    client_max_body_size 20m;

    # ---------- Gzip ----------
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------- 前端静态资源 ----------
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源长缓存（js/css/svg/图片/字体）
    location ~* \.(js|css|svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- API 反向代理 ----------
    # ^~ 优先于正则，保证 /api 下任何后缀（含 .js）都走代理
    location ^~ /api/ {
        # 尾斜杠：把 /api 前缀去掉再转发（与开发环境 Vite proxy 行为一致）
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/api/ai/think/:threadId）与长请求支持
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- SPA fallback：其余路径统一回 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
